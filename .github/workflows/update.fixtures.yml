name: Update fixtures

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  issues: write

jobs:
  update-fixtures:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fixture updater
        run: |
          python scripts/update_fixtures.py

      - name: Report scraper failures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FAILURES=$(python -c "
          import json
          status = json.load(open('data/last_update_status.json'))
          failed = {k: v for k, v in status.items() if not v.get('ok')}
          for k, v in failed.items():
              print(f\"- **{k}**: {v.get('note', 'unknown issue')} (rows kept: {v.get('rows', 0)})\")
          ")

          if [ -z "$FAILURES" ]; then
            echo "All sources OK, nothing to report."
            exit 0
          fi

          TITLE="Fixture scraper failures"
          BODY=$(printf "One or more fixture sources failed on the latest scheduled update:\n\n%s\n\nCheck data/last_update_status.json and the workflow run logs for details. This may be expected (e.g. off-season, no fixtures published yet) - verify before treating it as a bug.\n" "$FAILURES")

          EXISTING=$(gh issue list --search "in:title \"$TITLE\"" --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Commit updated fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fixtures_all.csv data/last_update_status.json

          if git diff --cached --quiet; then
            echo "No fixture changes to commit."
          else
            git commit -m "Update fixtures"
            git pull --rebase origin main
            git push origin main
          fi